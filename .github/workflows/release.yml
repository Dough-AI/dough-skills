name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill folder
        run: |
          mkdir -p dist
          for d in */; do
            d="${d%/}"
            [ -f "$d/SKILL.md" ] || continue
            zip -qr "dist/$d.zip" "$d" -x '*.DS_Store' -x '*/__pycache__/*'
          done
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
